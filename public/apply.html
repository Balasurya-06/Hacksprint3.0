<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply to HACKSPRINT 3.0 | Devfolio</title>
  <meta name="description" content="Apply to HACKSPRINT 3.0 — India's biggest student hackathon 2027, via Devfolio." />
  <meta name="robots" content="noindex, follow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #070506;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 24px;
      color: #f5f1ea;
    }
    h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 800; text-align: center; }
    p  { color: #888; font-size: 1rem; text-align: center; max-width: 480px; line-height: 1.6; }
    .sponsor-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
    .sponsor-label {
      color: #555;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .devfolio-logo-wrap {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .devfolio-logo-wrap img {
      height: 36px;
      width: auto;
      display: block;
    }
    a.back {
      color: #e51b24;
      font-size: 0.85rem;
      text-decoration: none;
    }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Apply to HACKSPRINT 3.0</h1>
  <p>Register for India's biggest student hackathon 2027 powered by Devfolio.</p>

  <!--
    DEVFOLIO APPLY BUTTON
    Official integration: https://guide.devfolio.co/docs/guide/apply-with-devfolio-integration
  -->
  <div
    class="apply-button"
    data-hackathon-slug="hacksprint3-0"
    data-button-theme="blue"
    style="height: 44px; width: 312px;"
  ></div>

  <!-- DEVFOLIO SPONSOR LOGO (required for brand integration verification) -->
  <div class="sponsor-section">
    <span class="sponsor-label">Platform Partner</span>
    <div class="devfolio-logo-wrap">
      <img
        src="/Sponsor/_Dark.png"
        alt="DEVFOLIO LOGO"
        width="160"
        height="36"
      />
    </div>
  </div>

  <a class="back" href="/">← Back to HackSprint 3.0</a>

  <!-- Devfolio SDK -->
  <script src="https://apply.devfolio.co/v2/sdk.js" async defer></script>

</body>
</html>
